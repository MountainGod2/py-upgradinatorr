[project]
name = "upgradinatorr"
version = "0.1.0"
description = "Automated media upgrade search for Starr applications"
readme = "README.md"
authors = [{ name = "MountainGod2", email = "admin@reid.ca" }]
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.3",
    "pydantic==2.13.5",
    "pydantic-settings==2.13.1",
    "rich==14.3.4",
    "rich-click==1.9.8",
    "stamina==25.2.0",
    "textual==8.1.1",
    "textual-dev==1.8.0",
]

[dependency-groups]
dev = [
    "aioresponses==0.7.9",
    "mypy==1.20.2",
    "pre-commit==4.5.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "ruff==0.15.2",
]
build = ["python-semantic-release==10.5.3", "uv==0.12.7", "gitpython<3.1.62"]

[project.scripts]
upgradinatorr = "upgradinatorr.cli:main"
upgradinatorr-tui = "upgradinatorr.tui:run_tui"

[build-system]
requires = ["uv_build==0.12.7"]
build-backend = "uv_build"

[tool.semantic_release]
build_command = """
  uv lock --upgrade-package "$PACKAGE_NAME"
  uv build
"""
allow_zero_version = true
major_on_zero = false

[tool.ruff]
line-length = 100
target-version = "py312"
preview = true
lint.select = ["ALL"]
lint.ignore = ["COM812"]
lint.pydocstyle.convention = "google"
lint.explicit-preview-rules = true
lint.mccabe.max-complexity = 35
lint.pylint.max-branches = 50
lint.pylint.max-statements = 120
lint.pylint.max-args = 10
lint.per-file-ignores = { "tests/*" = ["ANN401", "INP001", "S101", "SLF001"] }
format.quote-style = "double"
format.indent-style = "space"
format.skip-magic-trailing-comma = false
format.line-ending = "lf"
format.docstring-code-format = true
format.docstring-code-line-length = "dynamic"

[tool.mypy]
packages = "upgradinatorr"
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true
