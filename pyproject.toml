[project]
name = "upgradinatorr"
version = "0.1.0"
description = "Automated media upgrade search for Starr applications"
readme = "README.md"
authors = [
    { name = "MountainGod2", email = "admin@reid.ca" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp==3.13.3",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "rich==14.2.0",
    "rich-click==1.9.5",
]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "ruff==0.14.13",
]
build = [
    "python-semantic-release==10.5.3",
    "uv == 0.9.26",
]

[project.scripts]
upgradinatorr = "upgradinatorr.cli:main"

[build-system]
requires = ["uv_build==0.9.26"]
build-backend = "uv_build"

[tool.semantic_release]
build_command = """
  uv lock --upgrade-package "$PACKAGE_NAME"
  uv build
"""

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
packages = "upgradinatorr"
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
